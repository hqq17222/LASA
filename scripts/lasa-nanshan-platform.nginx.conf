server {
    listen 18480;
    server_name 106.15.35.204;
    client_max_body_size 100M;

    root /opt/lasa-nanshan-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18481;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:18481/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:18481/openapi.json;
    }

    location /static/ {
        alias /opt/lasa-nanshan-platform/data/uploads/;
        expires 7d;
    }
}
