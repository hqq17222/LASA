[program:lasa-nanshan-backend]
command=/opt/lasa-nanshan-platform/backend/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 18481 --workers 1
directory=/opt/lasa-nanshan-platform/backend
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/opt/lasa-nanshan-platform/data/logs/backend.err.log
stdout_logfile=/opt/lasa-nanshan-platform/data/logs/backend.out.log
environment=PYTHONPATH="/opt/lasa-nanshan-platform/backend"
